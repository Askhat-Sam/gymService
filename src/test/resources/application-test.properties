# Use MySQL test database
spring.datasource.url=jdbc:mysql://localhost:3306/gym_test_db
spring.datasource.username=testUser
spring.datasource.password=testUser
server.port=8084

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Prevent Spring Boot from replacing MySQL with in-memory H2 during tests
spring.test.database.replace=none

# Logging level
logging.level.root=INFO

# Disable Eureka service
eureka.client.enabled=false
